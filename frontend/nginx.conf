server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded statements (xls / pdf) are often over nginx's 1 MB default
    client_max_body_size 25m;

    # MCP audit trail: written by the MCP servers over the compose network, never via the UI
    location /api/audit/ {
        return 404;
    }

    location /api/ {
        # Re-resolve `backend` through Docker's DNS instead of once at startup, so
        # recreating the backend container doesn't leave this proxy on a stale IP (→ 502).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # category scans / reconcile agent call the LLM and can take a while
        proxy_read_timeout 300s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
