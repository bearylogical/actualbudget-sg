# ── IMPORTANT: API version matching ─────────────────────────────────────────
# @actual-app/api must match your Actual server version.
# If you see "out-of-sync-migrations", edit actual-bridge/package.json and
# pin "@actual-app/api" to match your server's release (e.g. "25.10.0").
# Find your server version at: http://your-server:5006/info
# ─────────────────────────────────────────────────────────────────────────────

# Optional LLM fallback for merchants no rule recognises (see backend/llm.py).
# Default is off. For privacy, prefer a local model (Ollama on the homelab).
x-llm-env: &llm-env
  LLM_PROVIDER: "none"            # none | ollama | openai | anthropic
  # LLM_MODEL: "qwen2.5:7b"       # ollama example; or gpt-4o-mini / claude-haiku-4-5
  # LLM_BASE_URL: "http://ollama.local.bearylogical.net/v1"   # OpenAI-compatible endpoint
  # LLM_API_KEY: ""               # not needed for ollama
  # LLM_MIN_CONFIDENCE: "0.5"
  # LLM_MAX_CONFIDENCE: "0.75"

services:
  actual-bridge:
    build: ./actual-bridge
    container_name: budget-actual-bridge
    restart: unless-stopped
    volumes:
      - actual-data:/data/actual
    environment:
      PORT: "3001"

  backend:
    build: ./backend
    container_name: budget-backend
    restart: unless-stopped
    # Bound to localhost: the backend proxies to your loaded budget with no auth of
    # its own, so it shouldn't be reachable from the LAN. The UI talks to it via nginx.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scheduler-data:/data      # category aliases + LLM cache (shared with scheduler)
    environment:
      <<: *llm-env
      ACTUAL_BRIDGE_URL: "http://actual-bridge:3001"
      DATA_DIR: "/data"
    depends_on:
      - actual-bridge

  frontend:
    build: ./frontend
    container_name: budget-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: budget-scheduler
    restart: unless-stopped
    volumes:
      - watch-dir:/watch
      - scheduler-data:/data
    environment:
      <<: *llm-env
      ACTUAL_BRIDGE_URL: "http://actual-bridge:3001"
      DATA_DIR: "/data"
      WATCH_DIR: "/watch"
      POLL_INTERVAL_SECONDS: "30"
      # ACTUAL_SERVER_URL: "http://your-actual-server:5006"
      # ACTUAL_PASSWORD: "your-password"
      # ACTUAL_BUDGET_ID: "your-budget-groupId"
      # Route each bank's file to its own account (name or id). Keys match the
      # detected bank ("UOB", "DBS/POSB", "OCBC") or the file name.
      # ACCOUNT_ROUTES: '{"uob": "UOB One Card", "posb": "POSB Savings"}'
      # ACTUAL_ACCOUNT_ID: "fallback-account-uuid"
      # SCHEDULER_USE_LLM: "true"
    depends_on:
      - actual-bridge

volumes:
  actual-data:
  watch-dir:
  scheduler-data:   # shared app data: scheduler-config.json, category aliases, LLM cache
