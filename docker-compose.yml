# ── IMPORTANT: API version matching ─────────────────────────────────────────
# @actual-app/api must match your Actual server version.
# If you see "out-of-sync-migrations", edit actual-bridge/package.json and
# pin "@actual-app/api" to match your server's release (e.g. "25.10.0").
# Find your server version at: http://your-server:5006/info
# ─────────────────────────────────────────────────────────────────────────────

# Pinned so volumes are budget-app_* wherever the repo is cloned (Mac or server).
name: budget-app

# Optional LLM fallback for merchants no rule recognises (see backend/llm.py).
# Default is off. For privacy, prefer a local model (Ollama on the homelab).
x-llm-env: &llm-env
  LLM_PROVIDER: "openai"
  LLM_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
  LLM_API_KEY: "${GEMINI_API_KEY}"
  LLM_MODEL: "gemini-3.1-flash-lite"

services:
  actual-bridge:
    build: ./actual-bridge
    container_name: budget-actual-bridge
    restart: unless-stopped
    volumes:
      - actual-data:/data/actual
    environment:
      PORT: "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backend:
    build: ./backend
    container_name: budget-backend
    restart: unless-stopped
    # Bound to localhost: the backend proxies to your loaded budget with no auth of
    # its own, so it shouldn't be reachable from the LAN. The UI talks to it via nginx.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scheduler-data:/data      # category aliases + LLM cache (shared with scheduler)
    environment:
      <<: *llm-env
      ACTUAL_BRIDGE_URL: "http://actual-bridge:3001"
      DATA_DIR: "/data"
      # LLM_HEALTH_TTL: "600"       # seconds between real LLM test calls in /health
      # Investments for the Money dashboard (Ghostfolio → Settings → Security token)
      GHOSTFOLIO_URL: "${GHOSTFOLIO_URL:-}"
      GHOSTFOLIO_TOKEN: "${GHOSTFOLIO_TOKEN:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      actual-bridge:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: budget-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: budget-scheduler
    restart: unless-stopped
    volumes:
      # On the server, point WATCH_DIR_HOST at a folder you drop statements into
      # (SMB / Syncthing). Unset → a Docker volume.
      - ${WATCH_DIR_HOST:-watch-dir}:/watch
      - scheduler-data:/data
    environment:
      <<: *llm-env
      ACTUAL_BRIDGE_URL: "http://actual-bridge:3001"
      DATA_DIR: "/data"
      WATCH_DIR: "/watch"
      POLL_INTERVAL_SECONDS: "30"
      # Actual connection: nothing to set here. Loading a budget in the web UI saves it
      # to /data/scheduler-config.json, which the scheduler reads (Disconnect clears it).
      # Accounts are routed by
      # what you've imported in the UI (/data/account_map.json).
      # Env overrides for a headless setup (the saved file wins if both exist):
      # ACTUAL_SERVER_URL / ACTUAL_PASSWORD / ACTUAL_BUDGET_ID
      # ACCOUNT_ROUTES: '{"uob 2583": "UOB One Card"}'   # only for never-imported accounts
      # ACTUAL_ACCOUNT_ID: "fallback-account-uuid"
      # SCHEDULER_USE_LLM: "true"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      actual-bridge:
        condition: service_healthy

  # Optional: the budget-app MCP server over HTTP for Claude clients on your tailnet.
  # `docker compose --profile mcp up -d mcp`. No auth and it has write tools, so it must
  # stay private: localhost by default, or MCP_PRIVATE_BIND=<the VM's tailscale IP>.
  mcp:
    profiles: ["mcp"]
    build: ./mcp
    container_name: budget-mcp
    restart: unless-stopped
    ports:
      - "${MCP_PRIVATE_BIND:-127.0.0.1}:8765:8765"
    environment:
      BUDGET_APP_URL: "http://backend:8000"
      MCP_ALLOWED_HOSTS: "${MCP_PRIVATE_HOSTS:-}"   # e.g. "budget-vm.tailnet.ts.net:*,100.x.y.z:*"
    depends_on:
      backend:
        condition: service_healthy

  # The claude.ai custom connector: read-only tools only, OAuth sign-in with your owner
  # password. Reached from the internet only through the tunnel below (or Tailscale Funnel
  # → 127.0.0.1:8766). See docs/SERVER.md.
  mcp-public:
    profiles: ["connector"]
    build: ./mcp
    container_name: budget-mcp-public
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:8765"     # for `tailscale funnel`; the Cloudflare tunnel uses the network
    volumes:
      - mcp-data:/data            # OAuth clients + hashed tokens
    environment:
      BUDGET_APP_URL: "http://backend:8000"
      # Both come from .env (see docs/SERVER.md); the container refuses to start without them.
      MCP_REQUIRE_PUBLIC: "true"
      MCP_PUBLIC_URL: "${MCP_PUBLIC_URL:-}"
      MCP_OWNER_PASSWORD_HASH: "${MCP_OWNER_PASSWORD_HASH:-}"
      MCP_ALLOWED_HOSTS: "budget-mcp-public:*"
      DATA_DIR: "/data"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      backend:
        condition: service_healthy

  # Cloudflare Tunnel for the connector only. In Zero Trust → Networks → Tunnels, create a
  # tunnel, copy its token into CLOUDFLARE_TUNNEL_TOKEN, and add ONE public hostname:
  #   budget-mcp.<your domain>  →  http://budget-mcp-public:8765
  cloudflared:
    profiles: ["connector"]
    image: cloudflare/cloudflared:latest
    container_name: budget-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      mcp-public:
        condition: service_healthy

volumes:
  actual-data:
  watch-dir:
  scheduler-data:   # shared app data: scheduler-config.json, category aliases, LLM cache
  mcp-data:         # connector OAuth state (mcp-public)
