name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github .
      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh
      - name: Validate docker-compose.yml
        run: docker compose config -q

  backend:
    # backend/tests also covers scheduler/ (it shares backend's modules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            scheduler/requirements.txt
      - run: pip install -r backend/requirements.txt -r scheduler/requirements.txt pytest
      - run: python -m pytest -q
        working-directory: backend

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/requirements.txt
      - run: pip install -r mcp/requirements.txt pytest
      # includes the end-to-end OAuth flow against a live public-mode server
      - run: python -m pytest -q mcp/tests

  actual-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the tests only touch dedup.js, so @actual-app/api isn't installed here
      - run: node --check index.js && node --check dedup.js
        working-directory: actual-bridge
      - run: npm test
        working-directory: actual-bridge

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
